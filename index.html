<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Friday Manager</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#f4f5ff;background:radial-gradient(ellipse at 10% 0,#40214c,transparent 55%),radial-gradient(ellipse at 100% 30%,#193f60,transparent 55%),#0b1020;min-height:100vh}main{max-width:1100px;margin:auto;padding:28px 18px}h1{font-size:clamp(26px,5vw,42px);margin:8px 0}h2{font-size:20px}small,.muted{color:#b6c0d5}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.glass{background:#ffffff0d;border:1px solid #ffffff26;box-shadow:0 16px 40px #0003;backdrop-filter:blur(20px);border-radius:22px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.grid .glass{margin:0}.price{font-size:clamp(24px,4vw,36px);font-weight:750;letter-spacing:-1px}.accent{color:#9ce8c7}.offer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #ffffff18;padding:16px 0}.offer:last-child{border:0}a{color:#fff;background:#6052bc;text-decoration:none;padding:10px 15px;border-radius:12px;display:inline-block}select,button{background:#252d46;color:white;border:1px solid #ffffff26;border-radius:10px;padding:10px;font:inherit}svg{width:100%;height:auto} .pill{border:1px solid #ffffff30;border-radius:30px;padding:8px 12px}footer{padding:20px 0}</style><main><header><div><small>BLACK FRIDAY 2026 · BRASIL</small><h1>Black Friday Manager</h1><div class="muted">Nintendo Switch 2 · Monitor de ofertas</div></div><span class="pill" id="status">Carregando…</span></header><section class="glass" id="best" aria-live="polite">Aguardando dados</section><div class="grid" id="metrics"></div><section class="glass"><h2>Histórico de preços</h2><div id="chart"></div></section><section class="glass"><header><h2>Ofertas recentes</h2><select id="filter"><option value="all">Todas</option><option value="bundle">Com jogos</option><option value="base">Sem jogos</option></select></header><div id="offers"></div></section><footer class="muted">Preços sujeitos a alterações. Confirme estoque, frete e condições na loja.</footer></main><script>
const $=id=>document.getElementById(id), money=n=>Number.isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—', esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), link=s=>{try{const u=new URL(s);return u.protocol==='https:'?u.href:''}catch{return ''}}, date=s=>new Date(s).toLocaleString('pt-BR',{timeZone:'America/Manaus'});let offers=[];
function card(o){return '<div class="offer"><div><strong>'+esc(o.store)+'</strong><div class="muted">'+esc(o.games.join(', ')||'Sem jogos')+' · '+esc(o.payment||'Preço anunciado')+'</div><small>'+esc(o.coupon?'Cupom: '+o.coupon:'')+'</small></div><div><strong>'+money(o.price)+'</strong> '+(link(o.url)?'<a target="_blank" rel="noopener noreferrer" href="'+esc(link(o.url))+'">Ver oferta</a>':'')+'</div></div>'}
function renderOffers(){const f=$('filter').value;const rows=offers.filter(o=>f==='all'||(f==='bundle')===!!o.games.length);$('offers').innerHTML=rows.map(card).join('')||'<p class="muted">Nenhuma oferta verificada.</p>'}
function min(os,b){return Math.min(...os.filter(o=>!!o.games.length===b).map(o=>o.price))}
function valid(o){return o&&Number.isFinite(o.price)&&o.price>0&&Array.isArray(o.games)&&typeof o.store==='string'&&link(o.url)&&o.inStock===true}
async function load(){const results=await Promise.allSettled(['00','30'].map(async n=>{const r=await fetch('data/collector-'+n+'.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}));const sources=results.filter(r=>r.status==='fulfilled'&&Array.isArray(r.value.runs)).map(r=>r.value.runs);const runs=sources.flat().filter(r=>Number.isFinite(Date.parse(r.at))&&Array.isArray(r.offers)).sort((a,b)=>Date.parse(a.at)-Date.parse(b.at));const latest=sources.map(s=>s.filter(r=>Number.isFinite(Date.parse(r.at))).sort((a,b)=>Date.parse(b.at)-Date.parse(a.at))[0]).filter(Boolean);const dedup=new Map();latest.sort((a,b)=>Date.parse(a.at)-Date.parse(b.at)).forEach(r=>(r.offers||[]).filter(valid).forEach(o=>dedup.set(o.url+'|'+o.games.join(','),o)));offers=[...dedup.values()].sort((a,b)=>a.price-b.price);const base=min(offers,false),bundle=min(offers,true),cap=base*1.1;const best=offers.find(o=>o.games.length&&o.price<=cap)||offers.find(o=>!o.games.length)||offers[0];$('status').textContent=runs.length?'Última coleta: '+date(runs.at(-1).at):'Aguardando primeira coleta';$('best').innerHTML=best?'<small>OFERTA RECOMENDADA</small><h2>'+esc(best.games.join(', ')||'Nintendo Switch 2 avulso')+'</h2><div class="price accent">'+money(best.price)+'</div>'+card(best):'<h2>Nenhuma oferta verificada ainda</h2><p class="muted">As pesquisas preencherão este painel.</p>';$('metrics').innerHTML=[['Menor avulso',money(base)],['Menor com jogos',money(bundle)],['Limite com jogos',money(cap)],['Ofertas disponíveis',offers.length]].map(([k,v])=>'<div class="glass"><small>'+k+'</small><div class="price">'+v+'</div></div>').join('');const points=runs.map(r=>({at:r.at,a:min(r.offers.filter(valid),false),b:min(r.offers.filter(valid),true)}));const values=points.flatMap(p=>[p.a,p.b]).filter(Number.isFinite);if(values.length){const low=Math.min(...values)-50,high=Math.max(...values)+50;const x=i=>45+i*620/Math.max(1,points.length-1),y=v=>15+(high-v)*160/(high-low);$('chart').innerHTML='<svg viewBox="0 0 690 205" role="img" aria-label="Histórico dos menores preços">'+[low,(low+high)/2,high].map(v=>'<text x="0" y="'+y(v)+'" fill="#b6c0d5" font-size="10">'+Math.round(v)+'</text><path d="M45 '+y(v)+' H675" stroke="#ffffff20"/>').join('')+['a','b'].map((k,j)=>points.map((p,i)=>Number.isFinite(p[k])?'<circle cx="'+x(i)+'" cy="'+y(p[k])+'" r="4" fill="'+(j?'#a8a5ff':'#9ce8c7')+'"><title>'+esc(date(p.at)+' · '+money(p[k]))+'</title></circle>':'').join('')).join('')+'</svg><small>Verde: avulso · Lilás: com jogos · Valores em reais</small>'}else $('chart').textContent='Aguardando dados históricos.';renderOffers();if(sources.length<2)$('status').textContent+=' · fonte indisponível'}
$('filter').onchange=renderOffers;load().catch(()=>{$('status').textContent='Falha ao carregar dados'});setInterval(()=>load().catch(()=>{}),60000);
</script></html>
